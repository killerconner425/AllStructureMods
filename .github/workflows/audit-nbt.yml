name: Inspect structure blocks and loot references
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/audit_nbt.py'
      - '.github/workflows/audit-nbt.yml'
permissions:
  contents: read
jobs:
  audit-nbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install nbtlib==2.0.4
      - run: python tools/audit_nbt.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thuns-block-and-loot-audit
          path: audit-output/
