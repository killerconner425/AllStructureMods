name: Batch import open-license structure datapacks
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/batch_import.py'
      - '.github/workflows/batch-import.yml'
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install nbtlib==2.0.4
      - run: python tools/batch_import.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AllStructureMods-batch-import
          path: dist/
